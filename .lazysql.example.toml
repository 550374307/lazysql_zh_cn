# Template for local manual-test connections. Generate credentials with:
#   ./scripts/manual-databases.sh init
# Run lazysql from this repository so this file is discovered automatically.

[application]
DefaultPageSize = 100
max_query_rows = 1000
schema_bulk_load_threshold = 200
exact_count_threshold = 50000
exact_count_timeout_ms = 200
max_open_connections = 4
max_idle_connections = 4
# UI language: "zh" (Simplified Chinese, default) or "en" (English).
# Any other value uses English as a base and is intended to be combined with
# language_file below.
language = "zh"
# Optional custom language file (JSON mapping English UI strings to their
# translations). Entries override the built-in language pack. Example:
#   language_file = "~/.config/lazysql/custom_zh.json"

[[database]]
Name = "Docker MySQL"
Provider = "mysql"
DBName = "lazysql_test"
URL = "mysql://lazysql:@@PASSWORD@@@127.0.0.1:3307/lazysql_test?parseTime=true"

# MySQL login-path credentials (no plaintext password in this file).
# Create the encrypted entry once with:
#   mysql_config_editor set --login-path=docker-mysql --host=127.0.0.1 \
#       --port=3307 --user=lazysql --password
# Then reference only its name; empty user/password/host/port fields are
# filled from ~/.mylogin.cnf (Windows: %APPDATA%\MySQL\.mylogin.cnf) at load.
# Explicitly set fields always win.
#[[database]]
#Name = "Docker MySQL (login-path)"
#Provider = "mysql"
#LoginPath = "docker-mysql"
#DBName = "lazysql_test"

[[database]]
Name = "Docker PostgreSQL"
Provider = "postgres"
DBName = "lazysql_test"
Schemas = ["public"]
URL = "postgres://lazysql:@@PASSWORD@@@127.0.0.1:5433/lazysql_test?sslmode=disable"

[[database]]
Name = "Docker MSSQL"
Provider = "sqlserver"
DBName = "lazysql_test"
Schemas = ["dbo"]
URL = "sqlserver://sa:@@PASSWORD@@@127.0.0.1:14331?database=lazysql_test&encrypt=disable"

[[database]]
Name = "Docker SQLite"
Provider = "sqlite3"
DBName = "lazysql.sqlite3"
URL = "file:./testdata/sqlite/lazysql.sqlite3?mode=rwc&_pragma=foreign_keys(1)"
